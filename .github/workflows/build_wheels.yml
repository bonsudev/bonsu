name: Build 

#on: [push, pull_request]
on:
  push:
    tags:        
      - '**'

env:
  #CIBW_BUILD_FRONTEND: "pip; args: --no-build-isolation"
  CIBW_BUILD: cp310-* cp311-* cp312-* cp313-* cp314-*
  CIBW_SKIP: cp37-* cp38-* cp39-* cp3??t-*
  CIBW_ARCHS_WINDOWS: "AMD64"
  CIBW_ARCHS_MACOS: "x86_64 arm64"
  CIBW_ARCHS_LINUX: "x86_64"
  CIBW_ENVIRONMENT_MACOS: CFLAGS='-arch x86_64 -arch arm64' CXXFLAGS='-arch x86_64 -arch arm64'
  CIBW_BEFORE_BUILD_WINDOWS: python .github/workflows/prepwin.py && python -m pip install numpy cython
  CIBW_BEFORE_BUILD_MACOS: python -m pip install numpy cython
  CIBW_BEFORE_BUILD_LINUX: python -m pip install numpy cython

jobs:
  build_wheels:
    
    permissions:
      contents: write
    
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-2022]
    
    steps:
      - uses: actions/checkout@v3

      # Used to host cibuildwheel
      - uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies for macOS 13
        if: startsWith(matrix.os, 'macos-13')
        run: |
          brew install llvm libomp
          export MACOSX_DEPLOYMENT_TARGET=10.9
          bash .github/workflows/prepmacos.sh
        env:
          CIBW_BEFORE_ALL: "MACOSX_DEPLOYMENT_TARGET=10.9"

      - name: Install dependencies for macOS latest
        if: startsWith(matrix.os, 'macos-latest')
        run: |
          echo "MACOSX_DEPLOYMENT_TARGET=$(sw_vers -productVersion | cut -d '.' -f 1-2)" >> $GITHUB_ENV
          brew install llvm libomp
          sudo chown -R $(whoami) /usr/local
          bash .github/workflows/prepmacos.sh

      - name: Install dependencies
        run: python -m pip install attrdict3 wxpython numpy vtk h5py pillow requests cython

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==3.4.1

      - name: Build wheels - macOS 13
        if: startsWith(matrix.os, 'macos-13')
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BEFORE_ALL: "MACOSX_DEPLOYMENT_TARGET=10.9"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_ENVIRONMENT: CFLAGS='-arch x86_64 -arch arm64' CXXFLAGS='-arch x86_64 -arch arm64'
          CC: /usr/local/opt/llvm/bin/clang
          CXX: /usr/local/opt/llvm/bin/clang
          C_INCLUDE_PATH: /usr/local/include
          CPLUS_INCLUDE_PATH: /usr/local/include
          LIBRARY_PATH: /usr/local/lib


      - name: Build wheels - macOS latest
        if: startsWith(matrix.os, 'macos-latest')
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_ARCHS_MACOS: "arm64"
          CIBW_ENVIRONMENT: CFLAGS='-arch arm64' CXXFLAGS='-arch arm64'
          CC: /opt/homebrew/opt/llvm/bin/clang
          CXX: /opt/homebrew/opt/llvm/bin/clang
          C_INCLUDE_PATH: /usr/local/include
          CPLUS_INCLUDE_PATH: /usr/local/include
          LIBRARY_PATH: /usr/local/lib


      - name: Build wheels - Windows
        if: startsWith(matrix.os, 'windows')
        run: python -m cibuildwheel --output-dir wheelhouse


      - name: Upload binaries to release
        uses: softprops/action-gh-release@v1
        if: ${{startsWith(github.ref, 'refs/tags/') }}
        with:
          files: ./wheelhouse/*.whl


  build_sdist:
    
    permissions:
      contents: write
    
    name: Build source package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.13'
  
      - name: Install required Python packages
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install build
          python -m pip install attrdict3
          python -m pip install wxpython numpy vtk h5py pillow requests cython

      - name: Build sdist
        run: |
          python -m build --sdist
      
      - name: Upload binaries to release
        uses: softprops/action-gh-release@v1
        if: ${{startsWith(github.ref, 'refs/tags/') }}
        with:
          files: ./dist/*


